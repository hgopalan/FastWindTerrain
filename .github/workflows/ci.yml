name: CI

# Runs on every pull request, which is the point: a contributor should
# find out that a change breaks a build or a regtest from the PR, not
# from someone else's machine after it merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: "1G"

jobs:
  # ---------------------------------------------------------------------
  # CMake build + the full regtest suite, via CTest.
  # ---------------------------------------------------------------------
  cmake:
    name: CMake (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux carries both build types; macOS builds Release only, to
          # keep the matrix honest without paying for a second AMReX
          # compile on the slower runner.
          - os: ubuntu-latest
            build_type: Release
          - os: ubuntu-latest
            build_type: Debug
          - os: macos-latest
            build_type: Release

    steps:
      - name: Checkout (with the AMReX submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the executable exists
        run: test -f build/fastwindterrain

      - name: Run the regtests
        run: ctest --test-dir build --output-on-failure

      - name: ccache stats
        if: always()
        run: ccache -s

  # ---------------------------------------------------------------------
  # The GNUmake build, which would otherwise rot unnoticed: nothing else
  # exercises it, and it is a supported path.
  # ---------------------------------------------------------------------
  gnumake:
    name: GNUmake (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with the AMReX submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # gfortran is needed here but not by the CMake build: AMReX's
          # GNUmake build compiles its Fortran sources, while the CMake
          # configuration turns Fortran off.
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran

      - name: Build
        run: make -j $(nproc)

      - name: Run the regtests against the GNUmake executable
        run: python3 run_regtests.py main3d.gnu.ex

  # ---------------------------------------------------------------------
  # The Python bindings, and the parity guarantee they rest on.
  #
  # The point of this job is the SECOND regtest run: the same suite,
  # driven through the bindings instead of the executable. Since both
  # link one compiled library, any difference between the two runs means
  # something other than the solver changed -- which is exactly what
  # would otherwise go unnoticed until a result did not reproduce.
  # ---------------------------------------------------------------------
  python:
    name: Python bindings (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with the AMReX and pybind11 submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # numpy is a runtime requirement of the bindings; CMake checks for
      # it at configure time, so this has to come first.
      - name: Install numpy
        run: python3 -m pip install --upgrade pip numpy

      - name: Configure with the bindings on
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFWT_PYTHON=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify both entry points exist
        run: |
          test -f build/fastwindterrain
          test -x build/fastwindterrain-py
          test -f build/python/fastwindterrain/__init__.py

      - name: Import the module
        run: |
          PYTHONPATH=build/python python3 -c \
            "import fastwindterrain as fwt; print(fwt.__version__, fwt.amrex_version())"

      # The regtests once through the executable...
      - name: Regtests through the C++ executable
        run: python3 run_regtests.py build/fastwindterrain

      # ...and again through the bindings. Same checkers, same
      # assertions, different entry point.
      - name: Regtests through the Python bindings
        run: python3 run_regtests.py build/fastwindterrain-py

      # The bindings' own suite, against the in-tree build. It finds the
      # module under build/python without an install, so this covers the
      # path a developer actually uses; the wheel job below covers the
      # installed one.
      - name: Install pytest
        run: python3 -m pip install pytest

      - name: The bindings test suite
        run: python3 -m pytest tests -v

  # ---------------------------------------------------------------------
  # The wheel: pip install, then the same test suite against the
  # INSTALLED package rather than the build tree.
  #
  # This is a different thing from the job above. That one imports out of
  # build/python; this one proves pyproject.toml, scikit-build-core and
  # the install rules actually produce something importable from
  # site-packages, with the console script on PATH. Those break
  # independently of the solver.
  #
  # It also executes examples/quickstart.ipynb, which is committed
  # without outputs and would otherwise rot invisibly behind results
  # nobody re-ran.
  # ---------------------------------------------------------------------
  wheel:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout (with the AMReX and pybind11 submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-wheel-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-wheel-${{ runner.os }}-

      # scikit-build-core passes CMAKE_ARGS through, which is the only
      # way to reach the underlying CMake from pip. Without ccache every
      # install recompiles the whole of AMReX.
      - name: Build and install the wheel
        env:
          CMAKE_ARGS: >-
            -GNinja
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v ".[test,notebook]"

      # From a directory with no build tree in it, so an import that only
      # worked via build/python would fail here.
      - name: Import the installed package
        run: |
          cd "$RUNNER_TEMP"
          python -c "import fastwindterrain as fwt; print(fwt.__version__, fwt.__file__)"
          python -c "from fastwindterrain import dataset; print(len(dataset.FIELDS), 'fields')"

      - name: The console script is on PATH
        run: |
          cd "$RUNNER_TEMP"
          fastwindterrain && exit 1 || test $? -eq 2

      # tests/ prefers the installed package over build/python, so this
      # runs against the wheel. The executable-comparison tests skip:
      # there is no build tree here, and parity is a property of one.
      - name: The test suite, against the wheel
        run: python -m pytest tests -v

      - name: ccache stats
        if: always()
        run: ccache -s

  # ---------------------------------------------------------------------
  # GPU backends: COMPILE ONLY.
  #
  # Hosted runners have no GPU, so these jobs prove the code still builds
  # for each backend and stop there. Running the regtests on them would
  # fail with "no CUDA-capable device is detected" and tell us nothing.
  #
  # This still earns its place: a device lambda that captures a host
  # container, or a kernel calling a host-only function, is a compile
  # error under nvcc and invisible to a CPU build.
  # ---------------------------------------------------------------------
  cuda:
    name: Build CUDA (compile only)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with the AMReX submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: 'network'
          use-github-cache: 'false'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Configure (CUDA)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFWT_GPU_BACKEND=CUDA \
            -DAMReX_CUDA_ARCH=8.0

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the executable exists
        run: test -f build/fastwindterrain

  hip:
    name: Build HIP (compile only)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with the AMReX submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build wget gnupg

      - name: Add the ROCm apt repository
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.2.4 jammy main' \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -qq

      - name: Install ROCm/HIP
        run: |
          sudo apt-get install -y --no-install-recommends \
            rocm-dev rocrand-dev rocprim-dev rocsparse-dev rocm-cmake
          echo 'export PATH=/opt/rocm/llvm/bin:/opt/rocm/bin:$PATH' \
            | sudo tee /etc/profile.d/rocm.sh

      - name: Configure and build (HIP, gfx90a)
        shell: bash
        run: |
          source /etc/profile.d/rocm.sh
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$(which clang) \
            -DCMAKE_CXX_COMPILER=$(which clang++) \
            -DFWT_GPU_BACKEND=HIP \
            -DAMReX_AMD_ARCH=gfx90a
          cmake --build build --parallel

      - name: Verify the executable exists
        run: test -f build/fastwindterrain

  sycl:
    name: Build SYCL (compile only)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with the AMReX submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build wget gnupg

      - name: Add the Intel oneAPI apt repository
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -qq

      - name: Install the Intel DPC++ compiler
        run: |
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp

      - name: Configure and build (SYCL)
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$(which icx) \
            -DCMAKE_CXX_COMPILER=$(which icpx) \
            -DFWT_GPU_BACKEND=SYCL
          cmake --build build --parallel

      - name: Verify the executable exists
        run: test -f build/fastwindterrain

  # ---------------------------------------------------------------------
  # A stray build artifact in a PR is easy to miss in review and annoying
  # to remove later, so the tree is checked after a full build and test.
  # ---------------------------------------------------------------------
  clean-tree:
    name: Working tree stays clean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with the AMReX submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Check for untracked or modified files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build or the regtests left files behind:"
            git status --porcelain
            echo
            echo "Regtests write into build/, which is gitignored."
            echo "Anything listed above escaped that."
            exit 1
          fi
          echo "Working tree is clean."
